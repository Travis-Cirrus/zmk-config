# Deep sleep after 20 minutes of inactivity (ZMK default is 15).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# Max radio power. Costs battery; drop this line to fall back to 0 dBm.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Required for the &mmv / &msc / &mkp bindings on the nav layer.
CONFIG_ZMK_POINTING=y

# RGB underglow. The WS2812 SPI driver is enabled automatically from the
# ws2812 node in corne.overlay, so no driver Kconfig is needed here.
CONFIG_ZMK_RGB_UNDERGLOW=y

CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=5
CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=5
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=5
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=3
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=1
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# No display is built. ZMK_RGB_UNDERGLOW_EXT_POWER is therefore left at its
# default of 'y', so the idle auto-off above cuts the LED rail completely
# rather than leaving 54 WS2812s drawing quiescent current.
