# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: mikoto@7.2.0//zmk
    shield: corne_left
    artifact-name: corne_left
  - board: mikoto@7.2.0//zmk
    shield: corne_right
    artifact-name: corne_right
  # Same firmware with the LED data pin on D0 (P0.04, the TRRS data pad)
  # instead of D1, for PCB revisions that moved the chain off D1.
  - board: mikoto@7.2.0//zmk
    shield: corne_left
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DRGB_DATA_PIN=4
    artifact-name: corne_left_rgb_on_D0
  - board: mikoto@7.2.0//zmk
    shield: corne_right
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DRGB_DATA_PIN=4
    artifact-name: corne_right_rgb_on_D0
  # Wipes the settings partition, which survives normal firmware flashes and
  # holds saved underglow and external power state. Also clears BLE pairings.
  - board: mikoto@7.2.0//zmk
    shield: settings_reset
    artifact-name: settings_reset